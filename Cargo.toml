[package]
name = "wawk-hello"
version = "0.1.0"
edition = "2021"
description = "Example wawk extension — a minimal greeting function for learning extension development"
repository = "https://github.com/ailurlabs/wawk-hello"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.42"

[package.metadata.component]
package = "wawk:extensions"

[package.metadata.component.target]
path = "wit"
world = "hello-extension"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
serde_json = "1"
